# Verificación automática: en cada push y pull request corre ESLint, los tests y el build (que incluye «tsc»).
# Si algo falla, GitHub lo marca en rojo antes de que lo publiques.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # firebase 13 pide Node 24 o más nuevo
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Sin .env.local el build no tiene Firebase: compila igual y el script de vistas previas avisa y sigue (ver scripts/prerender.mjs).
      - run: npm run build
